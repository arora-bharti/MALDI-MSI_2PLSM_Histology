name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        # Deliberately NOT installing from requirements.txt: that pulls TensorFlow
        # (~270 MB) which no test needs. csbdeep and opencv-python-headless are
        # both lightweight and TensorFlow-free, and without them the histology
        # tests silently skip instead of running.
        run: |
          # setuptools and wheel are upgraded too, not just pip: the runner's
          # preinstalled setuptools is old enough to be flagged by pip-audit below,
          # even though nothing here depends on it directly.
          pip install --upgrade pip setuptools wheel
          pip install numpy pandas scipy scikit-image scikit-learn \
                      matplotlib tifffile Pillow tqdm networkx shapely \
                      pyimzml csbdeep opencv-python-headless pytest \
                      mypy pip-audit

      - name: Type check (mypy)
        run: mypy src/ --ignore-missing-imports --no-strict-optional --no-error-summary

      - name: Security audit (pip-audit)
        run: pip-audit

      - name: Run tests
        run: pytest tests/ -v --tb=short
